name: 生日提醒（同步千翕 + 企业微信群推送）

on:
  schedule:
    # 时间用 UTC 写：UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只预览不发送（填 true 则不发）'
        required: false
        default: 'false'
      date:
        description: '模拟日期 YYYY-MM-DD（留空 = 今天）'
        required: false
        default: ''
      sync_dry:
        description: '同步只预览不写入（填 true 只看差异）'
        required: false
        default: 'false'
      skip_sync:
        description: '跳过千翕同步（填 true 只跑推送）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 第 1 步：把千翕系统里的客户生日同步进日历（新增 / 更正）
      # 用 continue-on-error：同步万一失败，也不影响后面的推送照常发
      - name: 同步千翕客户生日
        id: sync
        continue-on-error: true
        timeout-minutes: 40
        if: github.event.inputs.skip_sync != 'true'
        env:
          QX_USER: ${{ secrets.QX_USER }}
          QX_PWD: ${{ secrets.QX_PWD }}
          EDIT_KEY: ${{ secrets.EDIT_KEY }}
        run: |
          if [ -z "$QX_USER" ] || [ -z "$QX_PWD" ] || [ -z "$EDIT_KEY" ]; then
            echo "未配置千翕账号或日历口令，跳过同步（不影响推送）。"
            exit 0
          fi
          ARGS=""
          if [ "${{ github.event.inputs.sync_dry }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "同步参数: $ARGS"
          python sync_members.py $ARGS

      # 第 2 步：把今天命中的生日推送到企业微信群
      - name: 运行推送
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          echo "运行参数: $ARGS"
          python push_worker.py $ARGS

      - name: 保活（每月 1 号提交一次，避免仓库长期无活动被 GitHub 停用定时任务）
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u '+%Y-%m-%d %H:%M UTC' > heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            if git diff --staged --quiet; then
              echo "无变化，跳过"
            else
              git commit -m "保活 $(date -u '+%Y-%m')"
              git push
            fi
          else
            echo "非 1 号，跳过保活"
          fi
